# Publishes the portal to GitHub Pages.
#
# Two prerequisites, both one-time and both done by a person in the repository
# settings:
#   1. the repository is public (Pages serves a private repo only on a paid plan)
#   2. Settings -> Pages -> Source: "GitHub Actions", if the step below cannot
#      do it for us
#
# configure-pages is asked to create the Pages site itself. That failed while
# the repository was private with "Resource not accessible by integration",
# which reads like a token limitation but is also what GitHub returns for a
# private repository on a plan that cannot serve Pages. Now that the repository
# is public it is worth letting the action try, since it saves a manual step.
# It is a no-op once a Pages site exists.
name: Deploy portal to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The portal is static; the whole repository root is the site.
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
