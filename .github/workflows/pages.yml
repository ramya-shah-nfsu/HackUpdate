# Publishes the portal to GitHub Pages.
#
# The only prerequisite is that the repository is public, because Pages serves a
# private repository only on a paid plan. Pages itself does not need enabling by
# hand: configure-pages does it below.
name: Deploy portal to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on and point it at Actions, instead of requiring someone
          # to set it in the repository settings first. A no-op once enabled.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The portal is static; the whole repository root is the site.
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
