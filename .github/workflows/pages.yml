# Publishes the portal to GitHub Pages.
#
# Two prerequisites, both one-time and both done by a person in the repository
# settings:
#   1. the repository is public (Pages serves a private repo only on a paid plan)
#   2. Settings -> Pages -> Source: "GitHub Actions"
#
# Step 2 cannot be automated from here. actions/configure-pages accepts
# enablement: true, but creating a Pages site needs admin rights that the
# workflow's GITHUB_TOKEN does not have, so it fails with "Resource not
# accessible by integration". The token can deploy to a Pages site that already
# exists, which is all this workflow needs once the setting is applied.
name: Deploy portal to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The portal is static; the whole repository root is the site.
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
